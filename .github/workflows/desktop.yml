# Tests and packaged builds of the desktop app on macOS (Apple Silicon) and Windows.
# Each build runs the packaged worker on a fixture with the tiny model (packaging/build.py --smoke)
# and uploads the zipped app.
name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Build the macOS system audio helper
        if: runner.os == 'macOS'
        run: sh live/native/build.sh
      - name: Tests
        run: python -m pytest tests -q
      - name: Build and smoke test the packaged app
        run: python packaging/build.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Transcription-${{ runner.os }}
          path: dist/Transcription-*.zip
          if-no-files-found: error
